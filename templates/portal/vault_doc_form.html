{% extends "portal/base.html" %}
{% block title %}Edit Document — {{ company.name }} Vault{% endblock %}

{% block portal_content %}
<div class="max-w-2xl">
  <a href="{{ url_for('portal.vault', company_id=company.id, tab=doc.vault_tab) }}"
     class="text-slate-500 hover:text-white text-sm flex items-center gap-1 mb-6 transition-colors">
    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
    Back to {{ doc.vault_tab }} Vault
  </a>

  <div class="mb-8">
    <div class="flex items-center gap-2 text-amber-400 text-sm font-semibold mb-2">
      <span>{{ company.name }}</span>
      <span class="text-slate-600">›</span>
      <span>{{ doc.vault_tab }}</span>
    </div>
    <h1 class="text-3xl font-black text-white mb-1">Edit Document</h1>
  </div>

  <form method="POST" class="glass rounded-2xl p-6 space-y-5">
    <div>
      <label class="block text-slate-400 text-xs tracking-widest uppercase mb-2">Title *</label>
      <input type="text" name="title" required value="{{ doc.title }}"
             class="w-full bg-slate-800/60 border border-slate-700/50 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-amber-500/50 transition-all">
    </div>
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-slate-400 text-xs tracking-widest uppercase mb-2">Document Type</label>
        <input type="text" name="document_type" value="{{ doc.document_type or '' }}"
               class="w-full bg-slate-800/60 border border-slate-700/50 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-amber-500/50 transition-all">
      </div>
      <div>
        <label class="block text-slate-400 text-xs tracking-widest uppercase mb-2">File URL</label>
        <input type="url" name="file_url" value="{{ doc.file_url or '' }}"
               class="w-full bg-slate-800/60 border border-slate-700/50 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-amber-500/50 transition-all"
               placeholder="https://…">
      </div>
    </div>
    <div>
      <label class="block text-slate-400 text-xs tracking-widest uppercase mb-2">Description</label>
      <textarea name="description" rows="3"
                class="w-full bg-slate-800/60 border border-slate-700/50 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-amber-500/50 transition-all resize-none">{{ doc.description or '' }}</textarea>
    </div>
    <div>
      <label class="block text-slate-400 text-xs tracking-widest uppercase mb-2">Internal Notes</label>
      <textarea name="notes" rows="3"
                class="w-full bg-slate-800/60 border border-slate-700/50 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-amber-500/50 transition-all resize-none">{{ doc.notes or '' }}</textarea>
    </div>
    <div class="flex items-center gap-2">
      <input type="checkbox" name="is_confidential" id="is_conf" class="w-4 h-4 rounded accent-amber-500"
             {{ 'checked' if doc.is_confidential else '' }}>
      <label for="is_conf" class="text-slate-400 text-sm cursor-pointer">Mark as confidential</label>
    </div>
    <div class="flex items-center gap-4 pt-2">
      <button type="submit" class="btn-primary px-8 py-3 rounded-xl text-sm">Save Changes</button>
      <a href="{{ url_for('portal.vault', company_id=company.id, tab=doc.vault_tab) }}"
         class="btn-secondary px-6 py-3 rounded-xl text-sm">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
